# ==========================================================================
# slam_toolbox 定位模式 (localization)
#
# 與 mapper_params.yaml 的差別：
#   建圖模式 (async_slam_toolbox_node) 會一邊跑一邊改地圖，
#   Nav2 的 costmap 會跟著漂。真實流程應該是
#   建圖 -> 存檔 -> 切定位模式 -> 割草，割草時地圖固定不動。
#
# 座標系、雷達範圍、解析度這些沿用 mapper_params.yaml，
# 因為它們描述的是車子與感測器本身，不會因為換模式而改變。
# ==========================================================================

slam_toolbox:
  ros__parameters:
    # ---- 定位模式專屬 ----
    # localization 模式只做定位，不會把新的掃描加進地圖，
    # 所以 map -> odom 的修正還會繼續發布，但 /map 的內容固定。
    mode: localization

    # 序列化地圖的路徑，不要帶副檔名 (slam_toolbox 會自己找 .posegraph 與 .data)。
    # 由 localization.launch.py 的 map_file_name 參數覆寫。
    map_file_name: ""

    # 起始位姿。
    #
    # 注意：不要用 map_start_at_dock。實測 localization_slam_toolbox_node 會直接
    # 印出 "LocalizationSlamToolbox: Starting localization at first node (dock)
    # is correctly not supported."，也就是這個參數在定位模式下不生效。
    #
    # 兩個實際可用的作法：
    #   (a) 什麼都不設 —— 從 odom 原點開始定位。車子每次都從同一個停放點
    #       上電時這樣就夠了，實測 /map 會與存檔時完全一致 (401 x 402 cells)。
    #   (b) 起點不固定時，用 map_start_pose 指定 [x, y, yaw]，
    #       或上電後用 RViz 的 2D Pose Estimate (/initialpose) 給初始位姿。
    #
    # map_start_pose: [0.0, 0.0, 0.0]

    # 定位模式不需要無限成長的位姿圖，只保留最近這段時間的掃描來做匹配。
    # 建圖模式沒有這個參數 (它要留下全部的掃描才能閉環)。
    localization_search_maxdist: 2.0

    # ---- 以下沿用 mapper_params.yaml ----
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_loss_function: None
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function_type: HuberLoss

    # 坐標系定義 (與 URDF 對齊)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # 物理與感測器限制
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 1.0
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000

    # 建圖精度 (要與存檔時一致，否則 /map 的 width/height 對不上)
    resolution: 0.05
    max_range: 12.0
    min_range: 0.15
