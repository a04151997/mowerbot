# ==========================================================================
# Nav2 區域路徑控制 (只裝 controller_server)
#
# 本專案的 mower_manager 直接呼叫 FollowPath action，路徑由 F2C 產生，
# 因此不需要 planner_server / bt_navigator / behavior_server /
# smoother_server / waypoint_follower。
# ==========================================================================

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 0.3 -> 2.0 (2026-10-28，10-24 實車資料)：一邊割一邊建圖時，建圖程式重算地圖 (閉環) 在 N150 上
    # 卡住約 1.7 s，map -> odom 的時間戳停住 (slam transform_timeout 1.0 s 之後就過期)，控制器有 0.2 ~ 0.7 s
    # 查不到車子在地圖上的位置 ("Unable to transform robot pose into global plan's frame")。
    # 0.3 s 就放棄那一段：10-24 因此直接失敗 3 段、連帶 2 段。查不到的這段時間控制器送零速度 (車子停住)，
    # 等久一點不影響安全；collision_monitor 跟這個無關，照常用光達擋車。
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "approach_goal_checker", "align_goal_checker"]
    # AlignController (階段 38 決定 1)：每段開始前先原地對正的控制器。
    # navigation.launch.py 在啟動時從下面 FollowPath 注入它負責的鍵：critic 權重、max_vel_x = 0.0
    # (只能原地轉)、xy_goal_tolerance。這樣兩個控制器的 critic 權重永遠是同一份。
    # 其餘的鍵沿用 FollowPath，除非下面的 AlignController 區塊自己寫了 (注入不會蓋掉它們，見後續 5)。
    # max_vel_x = 0 是**收緊**速度限制 (上限從 0.7 降到 0)，不是放寬，因此不違反速度限制的凍結條件。
    controller_plugins: ["FollowPath", "AlignController"]

    # 割草機速度慢，進度檢查的時間給寬一點，避免正常慢速前進被誤判成卡住
    # 2026-10-20 will 同意 (D1)：SimpleProgressChecker 只看平移，原地對正一律要 15 s 內轉完，
    # 慢速時 180° 很容易超過。PoseProgressChecker 轉了 required_movement_angle 也算在動；
    # 真的卡住 (位置、角度都不動，包括停止區 / 手把斷線的暫停) 照樣 15 s 判失敗。
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      movement_time_allowance: 15.0

    # 覆蓋作業不在意最終朝向，yaw 容忍放寬
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 -> 0.10：goal checker 的容忍值等於「允許每條割草線提早多少距離結束」。
      # 設 0.25 時，每一條割草線都可以在距離終點 0.25 m 的地方就判定 SUCCEEDED
      # 而切換到下一條，等於每條線的尾端天生就少割半個刀盤寬 (刀盤 0.5 m)。
      # 實測前兩條以外的割草線最大覆蓋落差固定卡在 0.47~0.50 m，
      # 收緊到 0.10 m 讓車子必須真的走到端點才算完成。
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.5
      stateful: true

    # approach 段落專用 (階段 25)。**general_goal_checker 一個字都沒有動。**
    #
    # 【為什麼 approach 要另一個 goal checker】
    # approach 是「從車子當下位置直線開到下一段起點」，到站時車頭朝向就是
    # 那條直線的方向，而下一段要走的方向與它平均差 **171 度**
    # (報告 22.3 節，24 段量出來的中位數)，因為弓字形一條往東、下一條往西。
    #
    # general_goal_checker 的 stateful: true 會在 xy 達標之後把 xy 關掉、
    # 只等 yaw。於是車子開到目標 0.09 m 以內、xy 鎖定，接著花好幾秒轉那 171 度，
    # 轉的過程平均飄開 **0.36 m**（最大 0.67 m，割草線只飄 0.009 m）。
    # 飄完才回報 Reached the goal!，此時離目標 0.53 m，
    # manager 量到 >= 0.5 m 又插一段 approach —— 這就是 21 節那個 87.8 秒的迴圈。
    #
    # 對 approach 來說「到了沒」只該看位置：刀盤是關的，朝向沒有作業意義，
    # 下一段的對齊本來就由 DWB 的 PathAlign / PathDist 在那一段裡處理。
    # 所以 yaw 容忍設成 3.15 rad (> pi)，等於不檢查朝向。
    # 對正段落專用 (階段 38 決定 1)。**不要重用 approach_goal_checker**：它的 yaw 容忍 3.15 rad
    # 等於不檢查朝向，對正目標又就在車子當下位置 —— 送出的瞬間就會假成功，一度都沒轉。
    align_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # yaw_goal_tolerance = 0.10 是【實驗值，非推導值】。
      # 依據：docs/stage38_align_and_perimeter.md 與 simulation_results.md 38.13 的容忍值掃描
      #   (0.03 / 0.05 / 0.10 各 5 次：收斂 2/5、3/5、4/5；成功後 1 s 的最終誤差 0.16~0.17 / 0.15~0.17 / 0.09~0.12)。
      #   本模擬的停止精度約 0.15 rad，容忍值訂在它以下沒有意義。
      #   由幾何推導的 0.048 rad 是系統做不到的數字，已棄用。
      # ⚠ 這是【模擬限制下的值】，不是物理上的最佳值。模擬的低角速度行為已知不可信
      #   (低速死區、停不住、旋轉中心漂移)；實機量到原地旋轉角速度與停止精度後必須重新定案。
      yaw_goal_tolerance: 0.10
      # xy 容忍 0.50 (2026-10-28，10-24 實車資料)：以前從 approach_goal_checker 注入 0.10。
      # AlignController 不能平移 (max_vel_x = 0)，位置差了也修不回來；實車原地轉一開始會滑開
      # (90° 以上的原地轉 42 次有 39 次滑開 5 cm 以上，最多 16 cm)，建圖修正位置也會讓它差得更多。
      # 0.10 的時候方向已經對了 (差 0.7°、1°) 也永遠算不到「轉好」，15 s 後判失敗 (10-24 有 2 段)。
      # 「對正期間真的沒有前進」由測試 N8 用 approach_goal_checker 的 0.10 檢查，那個判準不動。
      xy_goal_tolerance: 0.50
      # stateful 必須是 false：對正的重點就是朝向，latch 掉 xy 之後只檢查 yaw 看似無害，
      # 但 stateful 已經讓 approach 假成功過一次 (階段 25)，這裡不冒險。
      stateful: false

    approach_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 3.15
      stateful: true

    # AlignController 自己的鍵 (注入不歸它管的部分；權重 / max_vel_x / xy_goal_tolerance 寫在這裡會被注入蓋掉並印 WARN)
    AlignController:
      # 對正階段的角速度下限 (階段 38 後續 4 / 6；2026-10-28 用 10-24 實車資料定成 0.30)。
      # 實車量到的 (卡住原因_1024.md，停著的車子給同一個指令 1 s，有沒有轉起來)：
      #   0.03 ~ 0.05 rad/s 5 % (328 次)、0.09 ~ 0.12 75 %、0.15 ~ 0.20 3 次都有、
      #   0.22 有一次 1 s 都沒轉、0.30 ~ 0.70 每次都轉得起來 (23 次)。
      # 以前是 0.0 (不設)：DWB 快轉到時給 0.02 ~ 0.03 rad/s，馬達不動，10-24 因此 1 段停在差 8.6° 的地方、
      # 15 s 後判失敗。0.30 = 實車每次都轉得起來的最小值。
      # 以前 0.3 不採用 (simulation_results.md 38.17：yaw 容忍 0.10 時收斂 1/5) 是 Gazebo 的結果，
      # 當時 Gazebo 給 0.31 rad/s 實際只轉 0.002 ~ 0.017，那是模擬的問題，實車沒有。
      # speed_scale 低到 FollowPath.max_vel_theta 比它小時 (0.25 以下)，navigation.launch.py 會把它降到
      # max_vel_theta，不然 DWB 一個合法的速度都沒有。
      min_speed_theta: 0.30
      # 這個值在這裡【不是速度限制】,而是一道開關。
      # DWB 的 isValidSpeed() 要求「平移 < min_speed_xy」且
      # 「|θ| < min_speed_theta」同時成立才剔除取樣。
      # AlignController 的 max_vel_x = 0,平移恆為 0、恆小於 0.01,
      # 所以第一個條件永遠成立,min_speed_theta 才會真正作用。
      # 它不改變任何速度上限,FollowPath 完全未動。
      # (前提 max_vel_x == 0 由 navigation.launch.py 的啟動斷言檢查，不成立就 abort。)
      min_speed_xy: 0.01
      # 往後預測 0.5 s (2026-10-30；以前跟 FollowPath 一樣 2.0 s)。最低轉速 0.30 以上時，預測 2 s
      # 每一個選擇都轉過頭 40° 左右，快轉到的時候分不出該繼續轉還是轉回來，再加上實車 /odom 的轉速
      # 每三筆有一筆是 0 (控制板 20 Hz、bridge 30 Hz)，車子就在目標前後來回晃：10-30 實車 72 次對正
      # 有 14 次超過 9 s、4 次卡住重轉。模擬 (馬達延遲 + 同樣的 /odom) 各 30 次：
      # 2.0 s 共 150 s、2 次卡住、4 次超過 9 s；0.5 s 共 69 s、0 次卡住、最久 5.5 s。
      sim_time: 0.5

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # 速度上限：對應 teleop 的 scale_linear 0.7 / scale_angular 1.2
      max_vel_x: 0.7
      min_vel_x: 0.0          # 不允許倒車 (割草機無後方感測器)
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.2
      max_speed_xy: 0.7
      min_speed_xy: 0.0       # 必須是 0，否則 DWB 不會取樣「原地旋轉」
      min_speed_theta: 0.0

      # 加速度：由 URDF 的 max_wheel_acceleration 3.0 rad/s^2 與輪半徑 0.17 m 推導
      # 線加速度 = 3.0 x 0.17 = 0.51 m/s^2
      # 角加速度 = (0.51 - (-0.51)) / 輪距 0.58 = 1.76 rad/s^2，保守取 1.5
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # xy_goal_tolerance 不寫在這裡 (階段 38 單一來源)：DWB 自己也有一份，兩處不一致時
      # 行為會不好預期 —— 以前靠註解「兩邊都要改」維持，現在由 navigation.launch.py
      # 直接把 general_goal_checker.xy_goal_tolerance 注入 FollowPath.xy_goal_tolerance，值不變 (0.10)。
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      # 明寫出來，值等於 Nav2 預設 2.0，行為不變 (階段 27)。
      # DWB 轉換路徑時，找第一個「離車子 < min(local costmap 半邊長, prune_distance)」
      # 的航點；找不到就回 "Resulting plan has 0 poses"。
      # mower_manager 的守門退路 (階段 26) 用 local costmap 半邊長 2.50 m 當門檻，
      # 所以目標在 2.0 ~ 2.5 m 之間時，守門會放行、控制器仍可能回 0 poses ——
      # 這是已知的放行縫隙 (報告 26.6 / 27 節)。改這個值等於改那道縫。
      prune_distance: 2.0

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]

      # 權重說明：以下四項都調回 Nav2 預設值。
      # 上一版為了對抗「相鄰割草線互相干擾」把 PathAlign/PathDist 調高、
      # GoalAlign/GoalDist 調低，但那組偏移本身就是車子停擺的原因：
      # DWB 的 PathDist/GoalDist 是 MapGridCritic，用 local costmap 的網格距離場
      # 評分，沒有路徑順序的概念，線距 0.5 m 時距離場幾乎是平的，調權重解不了。
      # 現在路徑已經在 mower_manager 端分解成一條一條的割草線，
      # 控制器視野裡永遠只有一條直線，不再需要在相鄰路徑之間做取捨，
      # 因此回到預設值即可，GoalDist 也重新成為車子前進的動力來源。
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0                    # 原本 40.0，改回 Nav2 預設
      PathAlign.forward_point_distance: 0.5    # 車長 0.95 m，預設 0.1 太短
      GoalAlign.scale: 24.0                    # 原本 8.0，改回 Nav2 預設
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 32.0                     # 原本 40.0，改回 Nav2 預設
      GoalDist.scale: 24.0                     # 原本 10.0，改回 Nav2 預設
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      # 車體 footprint 不寫在這裡 (階段 30 / 38)：由 navigation.launch.py 從
      # mowerbot_description/vehicle_geometry.py 取真實四角多邊形再傳給 local_costmap。
      # base_link = 後輪軸中心：[[0.975, 0.42], [0.975, -0.42], [-0.155, -0.42], [-0.155, 0.42]]。
      # costmap 從它自動算出內接半徑 0.155 (inflation 的 inscribed 帶) 與外接半徑 1.06。
      # 不要改用 robot_radius。

      # keepout_layer (2026-10-18)：使用者在地圖上用紅色畫的禁區 (keepout_server 發布的
      # /keepout_mask，map 座標系)。光達看不到的玻璃、坑洞，Nav2 也當成牆 —— 主要是擋
      # approach 那種直線路徑。排在第一個：obstacle_layer 取最大值疊上去，inflation_layer
      # 也會把禁區膨脹，跟真的牆一樣。沒畫禁區時 keepout_server 發的是 1 x 1、值 0 的遮罩，
      # 等於沒有這一層 (放在 odom 座標系：實車按 LB + A 之前沒有 map，見 keepout_server.py)。
      # 不用 Nav2 的 KeepoutFilter：Humble 的 filter 不會擴大更新範圍，遮罩只在其他圖層
      # 剛好更新到的格子裡生效。實測 (只有 inflation_layer 時) 開機後才載入的禁區一格都沒標上。
      # 推論 (沒有實測)：戶外光達前方沒東西、obstacle_layer 的更新範圍很小時也會這樣。
      # StaticLayer 在 rolling window 下每次都更新整個視窗，而且會把 map 座標系的遮罩換算到
      # odom (實測 map->odom 旋轉 0.5 rad 時位置完全吻合)。
      plugins: ["keepout_layer", "obstacle_layer", "inflation_layer"]

      keepout_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /keepout_mask
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.5

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 配合 car_radar.xacro 裡雷達的 12 m 量測上限
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 11.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        # inflation_radius 不寫在這裡 (階段 38)：由 navigation.launch.py 注入
        # vehicle_geometry.SOFT_INFLATION_RADIUS (0.45)。manager 的跑道離障礙物門檻、
        # Phase Q 讀同一個值；這裡再寫一份 launch 會直接拒絕啟動。
        # 定位是「柔性避讓」，不是安全保證 (docs/architecture.md「footprint 不對稱」一節)：
        # 內接半徑 0.155 只決定 cost 253 的帶寬，0.45 必須 > 側向半寬 0.42 梯度才延伸得到車身邊緣。

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server"]
    bond_timeout: 4.0
